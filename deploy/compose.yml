services:
  mapaeleitoral:
    image: ${APP_IMAGE:?Defina APP_IMAGE com a imagem compilada e tag de versão}
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    stop_grace_period: 25s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      PGHOST: ${DB_HOST:?Informe o endereço privado ou serviço de túnel para o banco do sv01}
      PGPORT: ${DB_PORT:-5432}
      PGDATABASE: VTXMkting
      PGUSER: eleitoral_to_readonly
      PGPASSWORD: ${PGPASSWORD:?Defina a senha exclusiva da aplicação no Portainer}
      TRUST_CLOUDFLARE: "true"
    expose:
      - "3000"
    # Sem ports: o Cloudflare Tunnel acessa a porta pela rede interna.
    networks:
      - tunnel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:?Informe a rede do único Cloudflare Tunnel da VPS}
